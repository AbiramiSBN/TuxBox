name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install patchelf
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Fetch proot + VirGL binaries
        run: ./scripts/fetch-proot.sh

      - name: Install NDK for the embedded X server
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "cmake;3.22.1" > /dev/null

      - name: Build embedded X server (Termux:X11 lorie)
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/termux/termux-x11.git third_party/termux-x11
          ./scripts/apply-lorie-patches.sh
          ./scripts/build-lorie.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Build
        run: ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: TuxBox-apk
          path: app/build/outputs/apk/**/*.apk
